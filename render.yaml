services:
  - type: web
    name: opspulse-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend/src && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: PYTHONPATH
        value: backend/src
      - key: OPSPULSE_DATABASE_URL
        sync: false
      - key: OPSPULSE_ALLOWED_ORIGINS
        sync: false
